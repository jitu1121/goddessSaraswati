<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Saraswati Puja | Ambition Library</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #ffefba 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents scrollbars from petals */
        }

        /* Container for the petals */
        #petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .petal {
            position: absolute;
            background-color: #ffcc33; /* Marigold Yellow */
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Main Celebration Card */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            padding: 3.5rem;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 650px;
            border: 2px solid #ffffff;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .library-name {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #b8860b;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #d35400;
            margin: 0;
        }

        .wishes {
            font-size: 1.4rem;
            color: #4e342e;
            margin: 1.5rem 0;
            line-height: 1.4;
        }

        .quote {
            font-style: italic;
            color: #795548;
            border-top: 1px solid rgba(211, 84, 0, 0.2);
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .veena-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body>

    <div id="petal-container"></div>

    <div class="container">
        <div class="library-name">Ambition Library</div>
        <div class="veena-icon">🌸 🪕 🌸</div>
        <h1>Happy Saraswati Puja</h1>
        <p class="wishes">Wishing all our students a divine path to wisdom, creativity, and light.</p>
        
        <div class="quote">
            "Knowledge is the greatest wealth one can possess."
        </div>
    </div>

    <script>
        function createPetal() {
            const container = document.getElementById('petal-container');
            const petal = document.createElement('div');
            
            // Randomize petal properties
            const size = Math.random() * 15 + 10 + 'px';
            const left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 3 + 4 + 's'; // 4-7 seconds
            const delay = Math.random() * 5 + 's';
            
            petal.classList.add('petal');
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = left;
            petal.style.animationDuration = duration;
            petal.style.animationDelay = delay;
            
            // Randomly pick white (jasmine) or yellow (marigold)
            const colors = ['#ffcc33', '#fff9c4', '#ffffff'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            container.appendChild(petal);

            // Remove petal after animation ends to keep DOM clean
            setTimeout(() => {
                petal.remove();
            }, (parseFloat(duration) + parseFloat(delay)) * 1000);
        }

        // Create a new petal every 300ms
        setInterval(createPetal, 300);
    </script>

</body>
</html>
